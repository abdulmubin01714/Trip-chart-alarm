<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Alarm</title>
<meta name="theme-color" content="#0a6b3f">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Alarm">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#0b6bcb;--bd:#e3e6ea;--rd:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1e2327;--tx:#eceff2;--mut:#9aa3ad;--ac:#5aa9ff;--bd:#2f363c;--rd:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:16px;max-width:520px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:8px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
.btn.full{width:100%;margin-top:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
.trip{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.trip:last-of-type{border:0}
.t{font-size:20px;font-weight:600}.m{color:var(--mut);font-size:14px}
.datebox{position:relative;display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin-bottom:8px;font-size:16px}
.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer}
.so{font-size:18px;margin:2px 0 8px}
.x{border:0;background:none;color:var(--rd);font-size:22px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>

const DAYS=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const parts=ds=>ds.split('-').map(Number);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const dow=ds=>{const [y,m,d]=parts(ds);return new Date(y,m-1,d).getDay();};
const keyFor=ds=>{const w=dow(ds);return w===5?'fri':w===6?'sat':'sun';};

function so(k,duty){const s=(SIGN[k]||{})[duty];return s?'<div class="so">Sign on <b>'+s[0]+'</b> <span class="m">'+s[1]+'</span></div>':'';}
let cur='sun';
let list=[];
try{list=JSON.parse(localStorage.getItem('roster')||'[]');}catch(e){}
function save(){try{localStorage.setItem('roster',JSON.stringify(list));}catch(e){}}

function chips(){
  $('chips').innerHTML='';
  for(const k in CH){
    const b=document.createElement('button');
    b.className='chip'+(k===cur?' on':'');b.textContent=CH[k].label;
    b.onclick=()=>{cur=k;chips();show();};
    $('chips').appendChild(b);
  }
}

function show(){
  const duty=$('duty').value.trim(),out=$('out');
  if(!duty){out.innerHTML='';return;}
  const times=CH[cur].d[duty];
  if(!times){out.innerHTML='<div class="card">ডিউটি '+duty+' এই চার্টে নেই</div>';return;}
  if(!times.length){out.innerHTML='<div class="card"><h2>ডিউটি '+duty+' · '+CH[cur].label+'</h2>'+so(cur,duty)+'<div class="m">এই ডিউটিতে কোনো ট্রিপ নেই</div></div>';return;}
  let h='<div class="card"><h2>ডিউটি '+duty+' · '+CH[cur].label+'</h2>'+so(cur,duty);
  times.forEach(([t,loc,end])=>{
    h+='<div class="trip"><div class="t">'+t+' <span class="m">'+loc+'</span></div></div>';
  });
  h+='<button class="btn full" id="add">📅 এই তারিখের জন্য তালিকায় যোগ করো</button></div>';
  out.innerHTML=h;
  $('add').onclick=addItem;
}

function addItem(){
  const ds=$('date').value,duty=$('duty').value.trim();
  if(!ds||!duty)return;
  list=list.filter(e=>!(e.d===ds&&e.duty===duty));
  list.push({d:ds,duty:duty,ch:cur});
  list.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  save();renderList();
}

function renderList(){
  const el=$('list');
  if(!list.length){el.innerHTML='';return;}
  let h='<div class="card"><h2>আমার ডিউটির তালিকা</h2>';
  list.forEach((e,i)=>{
    const [y,m,d]=parts(e.d);
    h+='<div class="trip"><div><div class="t">'+pad(d)+'/'+pad(m)+'/'+y+'</div><div class="m">'+DAYS[dow(e.d)]+' · ডিউটি '+e.duty+' · '+CH[e.ch].label+(SIGN[e.ch]&&SIGN[e.ch][e.duty]?' · Sign on '+SIGN[e.ch][e.duty][0]:'')+'</div></div><button class="x" data-i="'+i+'">×</button></div>';
  });
  h+='<button class="btn full" id="ics">ক্যালেন্ডারে যোগ করার ফাইল (.ics) নামাও</button></div>';
  el.innerHTML=h;
  el.querySelectorAll('.x').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.i,1);save();renderList();});
  $('ics').onclick=downloadIcs;
}

function buildIcs(items){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TripAlarm//BN'];
  items.forEach(e=>{
    const [y,m,d]=parts(e.d);
    const trips=CH[e.ch].d[e.duty]||[];
    trips.forEach(([t,loc,end],i)=>{
      const s=y+pad(m)+pad(d)+'T'+t.slice(0,2)+t.slice(3,5)+'00';
      const ed=new Date(y,m-1,d);if(end<t)ed.setDate(ed.getDate()+1);
      const en=ed.getFullYear()+pad(ed.getMonth()+1)+pad(ed.getDate())+'T'+end.slice(0,2)+end.slice(3,5)+'00';
      L.push('BEGIN:VEVENT','UID:trip-'+e.d+'-'+e.duty+'-'+i+'@tripalarm','DTSTAMP:'+s,'DTSTART:'+s,'DTEND:'+en,
        'SUMMARY:Duty '+e.duty+' - ট্রেন নেওয়া '+t+' ('+loc+')','END:VEVENT');
    });
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function downloadIcs(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buildIcs(list)],{type:'text/calendar'}));
  a.download='trip-duty.ics';a.click();
}

function showDate(){
  const ds=$('date').value;
  if(!ds){$('dtext').textContent='তারিখ বেছে নিন';return;}
  const [y,m,d]=parts(ds);
  $('dtext').textContent=pad(d)+'/'+pad(m)+'/'+y;
}
$('date').value=todayStr();
showDate();
cur=keyFor($('date').value);
function onDate(){showDate();if($('date').value){cur=keyFor($('date').value);chips();show();}}
$('date').addEventListener('change',onDate);
$('date').addEventListener('input',onDate);
$('go').onclick=show;
$('duty').addEventListener('input',show);
chips();renderList();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
