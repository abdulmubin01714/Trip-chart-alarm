<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Alarm</title>
<meta name="theme-color" content="#0a6b3f">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Alarm">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#0b6bcb;--bd:#e3e6ea;--rd:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1e2327;--tx:#eceff2;--mut:#9aa3ad;--ac:#5aa9ff;--bd:#2f363c;--rd:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:16px;max-width:520px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:8px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
.btn.full{width:100%;margin-top:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
.trip{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.trip:last-of-type{border:0}
.t{font-size:20px;font-weight:600}.m{color:var(--mut);font-size:14px}
.datebox{position:relative;display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin-bottom:8px;font-size:16px}
.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer}
.note{background:var(--bg);border-left:4px solid var(--ac);border-radius:6px;padding:10px 12px;margin:4px 0 10px;line-height:1.7}
.ver{color:var(--mut);font-size:12px;text-align:center;margin:20px 0 8px}
.mapw{position:relative;margin-top:10px}
.trk{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--bd)}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--mut)}
.sl{position:absolute;left:200px;font-size:12px;line-height:1.2;width:130px}
.sl b{font-size:13px}
.tm{position:absolute;width:42px;height:22px;line-height:22px;border-radius:11px;text-align:center;color:#fff;font-size:13px;font-weight:600}
.tm.DN{background:var(--ac)}.tm.UP{background:#0a6b3f}
.sheet{position:fixed;left:10px;right:10px;bottom:12px;max-height:46vh;overflow:auto;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;box-shadow:0 6px 22px rgba(0,0,0,.28);z-index:10}
.sheet[hidden]{display:none}
.sheet .x2{float:right;border:0;background:none;color:var(--mut);font-size:22px;line-height:1;padding:0 4px;cursor:pointer}
.sheet .nm{font-size:18px;font-weight:600;margin:4px 0}
.tm{cursor:pointer}
.tm.sel{outline:3px solid #f5a623}
summary{cursor:pointer;font-weight:600}
.lk{background:none;border:0;color:var(--ac);padding:0;font:inherit;cursor:pointer;text-decoration:underline}
textarea{width:100%;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);resize:vertical}
.so{font-size:18px;margin:2px 0 8px}
.x{border:0;background:none;color:var(--rd);font-size:22px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>
<h1>⏰ ট্রিপ অ্যালার্ম</h1>
<div class="chips" id="chips"></div>
<div class="datebox"><span id="dtext"></span><span class="cal">📅</span><input id="date" type="date"></div>
<div class="row">
  <input id="duty" type="number" inputmode="numeric" placeholder="ডিউটি নাম্বার">
  <button class="btn" id="go">দেখাও</button>
</div>
<div class="row">
  <input id="train" type="number" inputmode="numeric" placeholder="ট্রেন নাম্বার">
  <button class="btn" id="goTrain">খুঁজুন</button>
</div>
<button class="btn" id="goMap" style="width:100%;margin-bottom:8px">🚆 সব ট্রেনের অনুমানিত অবস্থান (লাইন)</button>
<div id="out"></div>
<div id="list"></div>
<details class="card" id="rosterBox"><summary>📋 রোস্টার যোগ করুন</summary>
<div class="m" id="rDate" style="margin:8px 0"></div>
<div id="rLogin">
  <input id="aMail" type="email" placeholder="অ্যাডমিন ইমেইল" style="width:100%;margin-bottom:6px">
  <div class="row"><input id="aPass" type="password" placeholder="পাসওয়ার্ড"><button class="btn" id="aGo">লগইন</button></div>
</div>
<div id="rAdmin" class="m" hidden>✔ অ্যাডমিন: <span id="aWho"></span> <button class="lk" id="aOut">লগআউট</button></div>
<textarea id="rText" rows="8" placeholder="5 আব্দুল করিম&#10;6 রহিম উদ্দিন&#10;7 সুমন আহমেদ" style="margin-top:8px"></textarea>
<div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn" id="rCloud">☁ ক্লাউডে সেভ</button><button class="btn" id="rSave" style="background:#5b6b7a">শুধু এই ফোনে সেভ</button></div>
<div class="row" style="flex-wrap:wrap"><button class="btn" id="rPdf">📄 PDF থেকে নাও</button><button class="btn" id="rFile" style="background:#5b6b7a">.txt থেকে নাও</button><button class="btn" id="rDel" style="background:#c0392b">মুছো</button></div>
<input id="rPick" type="file" accept=".txt,text/plain" hidden>
<input id="rPdfPick" type="file" accept="application/pdf,.pdf" hidden>
<div class="m" id="rStat"></div>
</details>
<div id="sheet" class="sheet" hidden></div>
<div class="ver">সংস্করণ v18.8</div>

const STN={UN:'উত্তরা উত্তর',UC:'উত্তরা সেন্টার',US:'উত্তরা দক্ষিণ',PA:'পল্লবী',M1:'মিরপুর-১১',M0:'মিরপুর-১০',KP:'কাজীপাড়া',SP:'শেওড়াপাড়া',AG:'আগারগাঁও',BJ:'বিজয় সরণি',FG:'ফার্মগেট',KB:'কারওয়ান বাজার',SB:'শাহবাগ',DU:'ঢাকা বিশ্ববিদ্যালয়',BS:'বাংলাদেশ সচিবালয়',MJ:'মতিঝিল'};
const DNO=['UN','UC','US','PA','M1','M0','KP','SP','AG','BJ','FG','KB','SB','DU','BS','MJ'];
const UPO=DNO.slice().reverse();
const fmt=s=>pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60));
const nm=c=>c+' ('+STN[c]+')';
function whereIs(k,tn,t){
  const runs=(RUNS[k]||{})[tn];
  if(!runs)return {s:'none'};
  for(let r=0;r<runs.length;r++){
    const [dn,up]=runs[r];
    const stops=[];
    DNO.forEach((c,i)=>stops.push([c,dn[i],'DN']));
    UPO.forEach((c,i)=>stops.push([c,up[i],'UP']));
    if(t>=stops[0][1]&&t<=stops[31][1]){
      for(let i=0;i<31;i++){
        const a=stops[i],b=stops[i+1];
        if(t>=a[1]&&t<=b[1]){
          if(a[0]===b[0])return {s:'at',st:a[0],until:b[1]};
          return {s:'between',from:a[0],to:b[0],dir:a[2],arr:b[1]};
        }
      }
    }
  }
  const first=runs[0][0][0],last=runs[runs.length-1][1][15];
  if(t<first)return {s:'before',next:first};
  if(t>last)return {s:'after'};
  for(let r=0;r<runs.length-1;r++){
    if(t>runs[r][1][15]&&t<runs[r+1][0][0])return {s:'wait',next:runs[r+1][0][0]};
  }
  return {s:'none'};
}
function dutyFor(k,tn,t){
  const d=CH[k].d,mm=s=>+s.slice(0,2)*3600+ +s.slice(3,5)*60;
  for(const duty in d){for(const x of d[duty]){if(x[3]===tn&&mm(x[0])<=t&&t<=mm(x[2])+59)return duty;}}
  return null;
}
function curSecs(){const n=new Date();return n.getHours()*3600+n.getMinutes()*60+n.getSeconds();}

function chips(){
  $('chips').innerHTML='';
  for(const k in CH){
    const b=document.createElement('button');
    b.className='chip'+(k===cur?' on':'');b.textContent=CH[k].label;
    b.onclick=()=>{cur=k;chips();refresh();};
    $('chips').appendChild(b);
  }
}

function show(){

  $('sheet').hidden=true;
  const duty=$('duty').value.trim(),out=$('out');

  const done=v=>{ROSTER[ds]={at:Date.now(),v:v};return v;};

    if(cm)return done(cm);

async function pdfLines(lib,buf){
  const pdf=await lib.getDocument({data:buf}).promise;
  const lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({x:it.transform[4],y:it.transform[5],s:it.str}));
    items.sort((a,b)=>b.y-a.y);
    const rows=[];
    items.forEach(it=>{
      const r=rows.length?rows[rows.length-1]:null;
      if(r&&Math.abs(r.y-it.y)<3)r.items.push(it);else rows.push({y:it.y,items:[it]});
    });
    rows.forEach(r=>lines.push(r.items.sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim()));
  }
  return lines;
}
function parseRosterLines(lines){
  const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  let date=null;const rows=[],skipped=[];
  lines.forEach(l=>{
    const d=l.match(/Date\s+(\d{1,2})-([A-Za-z]{3})[a-z]*-(\d{2,4})/);
    if(d&&MON[d[2].toLowerCase()]){
      const y=d[3].length===2?2000+ +d[3]:+d[3];
      date=y+'-'+String(MON[d[2].toLowerCase()]).padStart(2,'0')+'-'+String(+d[1]).padStart(2,'0');
    }
    const m=l.match(/^(TO-\d+)\s+(.+?)\s+(\S+)$/);
    if(m){if(/^\d+$/.test(m[3]))rows.push({duty:m[3],name:m[2],comp:m[1]});else skipped.push(m[3]);}
  });
  return {date,rows,skipped};
}

      const en=ed.getFullYear()+pad(ed.getMonth()+1)+pad(ed.getDate())+'T'+end.slice(0,2)+end.slice(3,5)+'00';
      L.push('BEGIN:VEVENT','UID:trip-'+e.d+'-'+e.duty+'-'+i+'@tripalarm','DTSTAMP:'+s,'DTSTART:'+s,'DTEND:'+en,
        'SUMMARY:Duty '+e.duty+' - ট্রেন নেওয়া '+t+' ('+loc+') · Train '+tn,'DESCRIPTION:Takeover from '+(/^\d+$/.test(from)?'duty '+from:from)+(mj?'\\nMJ departure '+mj:''),'END:VEVENT');
    });
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function icsName(){
  const nums=[...new Set(list.map(e=>e.duty))];
  const dn=nums.length>4?nums.slice(0,4).join('-')+'-etc':nums.join('-');
  const ds=list.map(e=>e.d).sort();
  const f=x=>{const [y,m,d]=parts(x);return pad(d)+'-'+pad(m)+'-'+y;};
  const dates=ds[0]===ds[ds.length-1]?f(ds[0]):f(ds[0])+'_to_'+f(ds[ds.length-1]);
  const n=new Date();
  const ts=pad(n.getHours())+pad(n.getMinutes())+pad(n.getSeconds());
  return 'duty-'+dn+'_'+dates+'_'+ts+'.ics';
}
function downloadIcs(){
  const name=icsName();
  const blob=new Blob([buildIcs(list)],{type:'text/calendar'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;a.click();
}
function showDate(){
  const ds=$('date').value;
  if(!ds){$('dtext').textContent='তারিখ বেছে নিন';return;}
  const [y,m,d]=parts(ds);
  $('dtext').textContent=pad(d)+'/'+pad(m)+'/'+y;
}
$('date').value=todayStr();
showDate();
cur=keyFor($('date').value);
function onDate(){showDate();rosterUI();if($('date').value){cur=keyFor($('date').value);chips();refresh();}}
$('date').addEventListener('change',onDate);
$('date').addEventListener('input',onDate);
$('go').onclick=show;
$('goTrain').onclick=showTrain;
$('goMap').onclick=showMap;
$('train').addEventListener('input',()=>{if($('train').value.trim().length>=3)showTrain();else if(!$('train').value.trim())$('out').innerHTML='';});
setInterval(()=>{if(mode==='train'&&$('train').value.trim())showTrain();else if(mode==='map')showMap();},30000);
$('duty').addEventListener('input',show);
chips();renderList();adminUI();rosterUI();
$('rCloud').onclick=()=>rosterAct('cloud');
$('rSave').onclick=()=>rosterAct('local');
$('rDel').onclick=()=>rosterAct('del');
$('aGo').onclick=async()=>{
  try{say('লগইন হচ্ছে…');await fbLogin($('aMail').value.trim(),$('aPass').value);$('aPass').value='';adminUI();say('অ্যাডমিন লগইন সফল');}
  catch(e){say(/INVALID|NOT_FOUND|PASSWORD|CREDENTIAL/.test(e.message)?'ইমেইল বা পাসওয়ার্ড ভুল':'লগইন ব্যর্থ: '+e.message);}
};
$('aOut').onclick=()=>{admin=null;idTok=null;saveAdmin();adminUI();say('লগআউট হয়েছে');};
$('rFile').onclick=()=>$('rPick').click();
$('rPdf').onclick=()=>$('rPdfPick').click();
$('rPdfPick').onchange=e=>{const f=e.target.files[0];if(f)rosterFromPdf(f);e.target.value='';};
$('rPick').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('rText').value=r.result;};r.readAsText(f);e.target.value='';};
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));}
</script>
